# Builds the Astro site and deploys it to GitHub Pages on every push to `main`.
#
# One-time setup (in the GitHub repo, not in this file):
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Actions → General → Workflow permissions: "Read and write permissions"
#
# Deployed URL: https://Drakaniia.github.io/ccna2/

name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch.
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping queued runs only for the same ref.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      # The site can only sign students in against a Worker that speaks the
      # same auth API (see AUTH_API_VERSION in worker/src/index.ts). Publishing
      # a site ahead of its Worker locks everyone out of the exams and looks to
      # each visitor like a fault in their own browser, so treat a Worker that
      # is behind as a failed deploy. A Worker that cannot be reached at all is
      # only a warning — a Cloudflare blip must not block unrelated site work.
      - name: Check the auth Worker is up to date
        run: |
          required=2
          if ! health=$(curl -fsS --max-time 10 https://ccna-auth.floresaybaez574.workers.dev/health); then
            echo "::warning::Could not reach the auth Worker; skipping the auth API version check."
            exit 0
          fi
          echo "auth Worker /health: $health"
          api=$(printf '%s' "$health" | sed -n 's/.*"api"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p')
          if [ -z "$api" ]; then
            echo "::error::The deployed auth Worker predates the API-version handshake. Deploy worker/ (see worker-deploy.yml) before publishing this site."
            exit 1
          fi
          if [ "$api" -lt "$required" ]; then
            echo "::error::The deployed auth Worker speaks auth API $api but this site needs $required. Deploy worker/ first."
            exit 1
          fi

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        env:
          # Public origin of the Cloudflare Worker that performs Buksu SSO auth.
          PUBLIC_AUTH_BASE_URL: https://ccna-auth.floresaybaez574.workers.dev
        # with:
        #   path: . # The root location of your Astro project inside the repository. (optional)
        #   node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
        #   package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
