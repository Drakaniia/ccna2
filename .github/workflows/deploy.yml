# Builds the Astro site and deploys it to GitHub Pages on every push to `main`.
#
# One-time setup (in the GitHub repo, not in this file):
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Actions → General → Workflow permissions: "Read and write permissions"
#
# Deployed URL: https://Drakaniia.github.io/ccna2/

name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch.
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping queued runs only for the same ref.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # with:
        #   path: . # The root location of your Astro project inside the repository. (optional)
        #   node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
        #   package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
